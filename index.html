  *{box-sizing:border-box}
  :root{
    --nero:#0B0B0B; --pannello:#161616; --bordo:#2A2A2A;
    --giallo:#FFD400; --inch:#F5F5F2; --muto:#8F8F88;
  }
  html,body{margin:0;background:var(--nero);color:var(--inch);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 48px}

  .top{position:sticky;top:0;z-index:10;background:var(--nero);
    padding:14px 0 10px;border-bottom:1px solid var(--bordo)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:13px 8px;border:1px solid var(--bordo);background:#111;
    color:var(--muto);border-radius:10px;font:600 14px/1 inherit;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer}
  .tab:focus-visible{outline:2px solid var(--giallo);outline-offset:2px}
  .tab.on{background:var(--giallo);border-color:var(--giallo);color:#0A0A0A}
  .stage{display:flex;justify-content:center}
  canvas{width:auto;height:38vh;max-height:340px;max-width:100%;
    border-radius:8px;background:#000;display:block}

  .sez{margin:22px 0 10px;font:700 12px/1 inherit;letter-spacing:.2em;
    text-transform:uppercase;color:var(--giallo)}
  .row{display:flex;gap:10px}
  .f{display:block;flex:1;margin-bottom:12px}
  .f span{display:block;margin-bottom:6px;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muto)}
  .f input, .f select{width:100%;padding:13px 12px;background:var(--pannello);
    border:1px solid var(--bordo);border-radius:9px;color:var(--inch);
    font:400 16px/1.2 inherit;-webkit-appearance:none;appearance:none}
  .f select{background-image:linear-gradient(45deg,transparent 50%,var(--muto) 50%),
    linear-gradient(135deg,var(--muto) 50%,transparent 50%);
    background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;
    background-size:6px 6px,6px 6px;background-repeat:no-repeat}
  .f input:focus, .f select:focus{outline:none;border-color:var(--giallo)}
  .f.mini{flex:0 0 96px}

  .file{display:block;margin-bottom:12px}
  .file input{position:absolute;width:1px;height:1px;opacity:0}
  .file span{display:block;padding:13px 12px;background:var(--pannello);
    border:1px dashed var(--bordo);border-radius:9px;color:var(--muto);
    font-size:14px;text-align:center;cursor:pointer}
  .file input:focus-visible + span{border-color:var(--giallo);color:var(--inch)}
  .file span.pieno{border-style:solid;border-color:var(--giallo);color:var(--inch)}

  .gens{display:flex;gap:10px;margin-top:18px}
  .gen{flex:1;padding:18px 10px;border:0;border-radius:11px;
    background:var(--giallo);color:#0A0A0A;font:400 26px/1 "Anton",Impact,sans-serif;
    letter-spacing:.04em;cursor:pointer}
  .gen.alt{background:transparent;border:2px solid var(--giallo);color:var(--giallo)}
  .gen:active{transform:translateY(1px)}
  .gen:disabled{opacity:.45;cursor:default}
  .gen:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .stato{margin:12px 0 0;min-height:20px;text-align:center;font-size:14px;color:var(--giallo)}

  .out{margin-top:22px;text-align:center}
  .out img{width:60%;max-width:220px;border-radius:8px}
  .out a{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:9px;
    border:1px solid var(--giallo);color:var(--giallo);text-decoration:none;font-size:15px}
  .out p{margin:12px 0 0;font-size:13px;color:var(--muto);line-height:1.5}
  .nascosto{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="tabs">
      <button class="tab on" id="t-gol" type="button">Gol</button>
      <button class="tab" id="t-md" type="button">Match day</button>
    </div>
    <div class="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
  </div>

  <!-- ---------- GOL ---------- -->
  <div id="p-gol">
    <div class="sez">Marcatore</div>
    <div class="row">
      <label class="f"><span>Nome sulla grafica</span>
        <input id="g-nome" type="text" placeholder="Cognome" autocomplete="off"></label>
      <label class="f mini"><span>Numero</span>
        <input id="g-num" type="text" inputmode="numeric" placeholder="10" maxlength="2"></label>
    </div>
    <label class="file"><input id="g-foto" type="file"
        accept="image/*,video/*,video/quicktime,video/mp4,.mov,.mp4,.m4v,.hevc">
      <span id="g-foto-l">Scegli la foto o la clip dell'esultanza</span></label>

    <div class="sez">Punteggio</div>
    <div class="row">
      <label class="f"><span>Casa</span>
        <input id="g-casa" type="text" placeholder="Squadra" autocomplete="off"></label>
      <label class="f mini"><span>Gol</span>
        <input id="g-gc" type="text" inputmode="numeric" placeholder="2" maxlength="2"></label>
    </div>
    <div class="row">
      <label class="f"><span>Ospite</span>
        <input id="g-osp" type="text" placeholder="Squadra" autocomplete="off"></label>
      <label class="f mini"><span>Gol</span>
        <input id="g-go" type="text" inputmode="numeric" placeholder="1" maxlength="2"></label>
    </div>
    <label class="f mini" style="flex:0 0 120px"><span>Minuto</span>
      <input id="g-min" type="text" inputmode="numeric" placeholder="67" maxlength="4"></label>
  </div>

  <!-- ---------- MATCH DAY ---------- -->
  <div id="p-md" class="nascosto">
    <div class="sez">Squadre</div>
    <label class="f"><span>Casa</span>
      <input id="m-casa" type="text" placeholder="La tua squadra" autocomplete="off"></label>
    <label class="file"><input id="m-lcasa" type="file" accept="image/*">
      <span id="m-lcasa-l">Scegli lo stemma di casa</span></label>
    <label class="f"><span>Ospite</span>
      <input id="m-osp" type="text" placeholder="Avversario" autocomplete="off"></label>
    <label class="file"><input id="m-losp" type="file" accept="image/*">
      <span id="m-losp-l">Scegli lo stemma ospite</span></label>

    <div class="sez">Dove e quando</div>
    <div class="row">
      <label class="f"><span>Data</span>
        <input id="m-data" type="text" placeholder="Sab 12 ott" autocomplete="off"></label>
      <label class="f mini"><span>Ora</span>
        <input id="m-ora" type="text" placeholder="15:00" maxlength="5"></label>
    </div>
    <label class="f"><span>Stadio</span>
      <input id="m-stadio" type="text" placeholder="Nome stadio" autocomplete="off"></label>
  </div>

  <div class="sez">Piè di pagina</div>
  <div class="row">
    <label class="f"><span>Handle</span>
      <input id="c-handle" type="text" autocomplete="off"></label>
    <label class="f"><span>Hashtag</span>
      <input id="c-tag" type="text" autocomplete="off"></label>
  </div>

  <label class="f" id="codecbox"><span>Codifica del video</span>
    <select id="codec">
      <option value="auto">Automatica (consigliata)</option>
      <option value="h264">H.264 — massima compatibilità</option>
      <option value="hevc">HEVC / H.265 — file più leggero</option>
      <option value="webm">WebM</option>
    </select>
  </label>

  <div class="gens">
    <button class="gen" id="gen" type="button">Genera PNG</button>
    <button class="gen alt" id="genvid" type="button">Genera video</button>
  </div>
  <p class="stato" id="stato"></p>
  <div class="out nascosto" id="out"></div>
</div>

<script>
/* =========================================================================
   IMPOSTAZIONI FISSE — cambiale una volta e restano per ogni partita
   ========================================================================= */
const CFG = {
  handle:  "@LATUASQUADRA",
  hashtag: "#FORZASQUADRA",
  giallo:  "#FFD400"
};
/* ========================================================================= */

const INCH = "#F5F5F2", MUTO = "#8F8F88", SCURO = "#151515", GESSO = "#FFFFFF";
const GIALLO = CFG.giallo, SU_GIALLO = "#0A0A0A";
const W = 1080, H = 1920;

const $ = i => document.getElementById(i);
const cv = $("cv"), ctx = cv.getContext("2d");
let scheda = "gol";
let foto = null, logoCasa = null, logoOsp = null;

/* ---------- utilità di disegno ---------- */
function scrivi(t, x, y, size, colore, famiglia, ls, allineamento){
  if(!t) return;
  ctx.font = size + "px " + (famiglia || "Anton");
  ctx.fillStyle = colore;
  ctx.textAlign = allineamento || "center";
  if("letterSpacing" in ctx) ctx.letterSpacing = (ls || 0) + "px";
  ctx.fillText(t, x, y);
  if("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
const ARIAL = "Arial, Helvetica, sans-serif";

function rett(x, y, w, h, r){
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function misura(m){
  return [m.videoWidth || m.naturalWidth || m.width, m.videoHeight || m.naturalHeight || m.height];
}
function cerchioImmagine(img, cx, cy, r){
  const d = misura(img);
  if(!d[0] || !d[1]) return;
  const s = Math.max(2 * r / d[0], 2 * r / d[1]);
  const w = d[0] * s, h = d[1] * s;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
  ctx.restore();
}

function sfondo(){
  const g = ctx.createRadialGradient(540, 806, 0, 540, 806, 1500);
  g.addColorStop(0, "#232323"); g.addColorStop(0.55, "#131313"); g.addColorStop(1, "#050505");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2.5;
  ctx.strokeRect(46, 132, 988, 1656);
  const r = 34, ang = [[46,132,0],[1034,132,0.5],[1034,1788,1],[46,1788,1.5]];
  ang.forEach(function(a){
    ctx.beginPath();
    ctx.arc(a[0], a[1], r, a[2] * Math.PI, (a[2] + 0.5) * Math.PI);
    ctx.stroke();
  });
}

function piede(){
  const t = [CFG_handle(), CFG_tag()].filter(Boolean).join("   ·   ");

}

function disegnaGol(){
  sfondo();
  scrivi("GOL!", 540, 544, 228, GIALLO, "Anton", 4);

  const cx = 540, cy = 915, r = 178;
  ctx.fillStyle = SCURO;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  if(foto) cerchioImmagine(foto, cx, cy, r);
  else scrivi("FOTO", cx, cy + 9, 24, MUTO, ARIAL, 4);
  ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = GIALLO;
  ctx.beginPath(); ctx.arc(694, 785, 58, 0, Math.PI * 2); ctx.fill();
  scrivi(val("g-num"), 694, 806, 60, SU_GIALLO);

  scrivi(val("g-nome").toUpperCase(), 540, 1230, 104, INCH, "Anton", 1);

  const by = 1352;
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2.5;
  rett(170, by, 740, 190, 10); ctx.stroke();
  ctx.fillStyle = GIALLO; rett(478, by - 27, 124, 54, 27); ctx.fill();
  const m = val("g-min");
  scrivi(m ? m + "'" : "", 540, by + 11, 40, SU_GIALLO);

  rigaPunteggio(val("g-casa"), val("g-gc"), val("g-go"), val("g-osp"), by + 118);

function rigaPunteggio(casa, gc, go, osp, y){
  const pezzi = [];
  if(casa) pezzi.push({t: casa.toUpperCase(), s: 54, c: INCH});
  if(gc)   pezzi.push({t: gc, s: 58, c: GIALLO});
  if(gc && go) pezzi.push({t: "–", s: 46, c: INCH});
  if(go)   pezzi.push({t: go, s: 58, c: INCH});
  if(osp)  pezzi.push({t: osp.toUpperCase(), s: 54, c: INCH});
  if(!pezzi.length) return;
  const spazio = 22;
  let tot = 0;
  pezzi.forEach(function(p){ ctx.font = p.s + "px Anton"; p.w = ctx.measureText(p.t).width; tot += p.w; });
  tot += spazio * (pezzi.length - 1);
  let x = 540 - tot / 2;
  pezzi.forEach(function(p){ scrivi(p.t, x, y, p.s, p.c, "Anton", 0, "left"); x += p.w + spazio; });
}

/* ---------- caricamento file senza blob URL (bloccati nelle anteprime protette) ---------- */
function leggiDataURL(file, ok, ko){
  const fr = new FileReader();
  fr.onload  = function(){ ok(fr.result); };
  fr.onerror = function(){ ko("lettura del file fallita"); };
  fr.readAsDataURL(file);
}

function caricaImmagine(file, ok, ko){
  function perDataURL(){
    leggiDataURL(file, function(d){
      const im = new Image();
      im.onload  = function(){ ok(im); };
      im.onerror = function(){ ko("immagine non leggibile"); };
      im.src = d;
    }, ko);
  }
  if(window.createImageBitmap){
    try { createImageBitmap(file).then(ok).catch(perDataURL); return; }
    catch(e){ /* si prosegue con il data URL */ }
  }
  perDataURL();
}

function caricaVideo(file, ok, ko){
  let giaRipiegato = false;
  function prova(src){
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true; v.defaultMuted = true;
    v.setAttribute("playsinline", ""); v.setAttribute("muted", "");
    v.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.appendChild(v);      // iOS decodifica solo i video presenti nel DOM
    v.onloadeddata = function(){
      const p = v.play();
      if(p && p.catch) p.catch(function(){});
      ok(v);
    };
    v.onerror = function(){
      if(v.parentNode) v.parentNode.removeChild(v);
      ripiego();
    };
    v.src = src;
  }
  function ripiego(){
    if(giaRipiegato){
      ko("questo browser non decodifica la clip. Se viene da iPhone è in HEVC/H.265: " +
         "aprila in Safari, oppure imposta Fotocamera › Formati › Massima compatibilità " +
         "per registrare in H.264.");
      return;
    }
    giaRipiegato = true;                // i blob URL sono bloccati in certe anteprime
    leggiDataURL(file, prova, ko);
  }
  // prima il blob URL: le clip iPhone sono grandi e il data URL le raddoppia in memoria
  try { prova(URL.createObjectURL(file)); }
  catch(e){ ripiego(); }
}

function canvasPulito(){               // false se il browser ha "contaminato" il canvas
  try { ctx.getImageData(0, 0, 1, 1); return true; } catch(e){ return false; }
}

function collegaFile(idInput, idEtichetta, testo, assegna){
  $(idInput).onchange = function(e){
    const f = e.target.files[0];
    if(!f) return;
    const et = $(idEtichetta);
    const fatto = function(m){
      assegna(m);
      et.classList.add("pieno"); et.textContent = testo + " ✓";
      disegna();
      if(!canvasPulito())
        errore("Questa anteprima blocca le immagini caricate: usa la versione online per esportarle.");
      else mostraDiagnostica();
    };
    const fallito = function(msg){ errore(testo + ": " + msg); };
    if(f.type.indexOf("video") === 0) caricaVideo(f, fatto, fallito);
    else caricaImmagine(f, fatto, fallito);
  };
}

/* ---------- animazione GOOOOL ---------- */
const CICLO = 2400, DURATA = 7200;          // millisecondi
const BUCO = {cx: 540, cy: 930, r: 225};

function disegnaGolAnimato(t){               // t va da 0 a 1 dentro il ciclo
  sfondo();

  // scritta che trema: somme di seni a frequenze intere, così il loop è continuo
  const dx  = 8 * Math.sin(2*Math.PI*7*t) + 5 * Math.sin(2*Math.PI*11*t + 1.3);
  const dy  = 6 * Math.sin(2*Math.PI*9*t + 0.7) + 4 * Math.sin(2*Math.PI*13*t + 2.1);
  const rot = (1.8 * Math.sin(2*Math.PI*5*t + 0.4) + Math.sin(2*Math.PI*8*t + 1.9)) * Math.PI / 180;
  const sca = 1 + 0.025 * Math.sin(2*Math.PI*3*t);
  ctx.save();
  ctx.translate(540 + dx, 470 + dy); ctx.rotate(rot); ctx.scale(sca, sca);
  ctx.font = "200px Anton";
  const largh = ctx.measureText("GOOOOL!").width || 1;
  ctx.font = (200 * 880 / largh) + "px Anton";
  ctx.fillStyle = GIALLO; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if("letterSpacing" in ctx) ctx.letterSpacing = "4px";
  ctx.fillText("GOOOOL!", 0, 0);
  ctx.restore();
  if("letterSpacing" in ctx) ctx.letterSpacing = "0px";

  const b = BUCO;
  ctx.fillStyle = SCURO;
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.fill();
  if(foto) cerchioImmagine(foto, b.cx, b.cy, b.r);
  else scrivi("CLIP", b.cx, b.cy + 9, 26, MUTO, ARIAL, 4);

  ctx.strokeStyle = "rgba(255,212,0," + (0.6 * (1 - t)).toFixed(3) + ")";
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r + 150 * t, 0, Math.PI * 2); ctx.stroke();

  ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = GIALLO;
  ctx.beginPath(); ctx.arc(699, 771, 58, 0, Math.PI * 2); ctx.fill();
  scrivi(val("g-num"), 699, 792, 60, SU_GIALLO);

  scrivi(val("g-nome").toUpperCase(), 540, 1300, 92, INCH, "Anton", 1);

  const by = 1352;
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2.5;
  rett(170, by, 740, 190, 10); ctx.stroke();
  ctx.fillStyle = GIALLO; rett(478, by - 27, 124, 54, 27); ctx.fill();
  const m = val("g-min");
  scrivi(m ? m + "'" : "", 540, by + 11, 40, SU_GIALLO);
  rigaPunteggio(val("g-casa"), val("g-gc"), val("g-go"), val("g-osp"), by + 118);
  piede();
}

/* Le stringhe dei codec cambiano da browser a browser: Safari vuole hvc1,
   Chrome pretende hev1 con il profilo completo. Le proviamo tutte. */
const CODEC = {
  h264: ["video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1.64003E",
         "video/mp4;codecs=avc1", "video/mp4;codecs=h264", "video/mp4",
         "video/webm;codecs=h264"],
  hevc: ["video/mp4;codecs=hvc1.1.6.L93.B0", "video/mp4;codecs=hvc1.1.6.L120.90",
         "video/mp4;codecs=hev1.1.6.L120.90", "video/mp4;codecs=hev1.1.6.L93.B0",
         "video/mp4;codecs=hvc1", "video/mp4;codecs=hev1"],
  webm: ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
};

function primoSupportato(lista){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return null;
  for(let i = 0; i < lista.length; i++){
    try { if(MediaRecorder.isTypeSupported(lista[i])) return lista[i]; } catch(e){}
  }
  return null;
}

function formatoVideo(){
  const scelta = ($("codec") && $("codec").value) || "auto";
  if(scelta !== "auto" && CODEC[scelta]) return primoSupportato(CODEC[scelta]);
  return primoSupportato(CODEC.h264) || primoSupportato(CODEC.hevc) || primoSupportato(CODEC.webm);
}

function nomeCodec(t){
  if(!t) return "nessuno";
  if(t.indexOf("hvc1") >= 0 || t.indexOf("hev1") >= 0) return "HEVC/H.265";
  if(t.indexOf("webm") >= 0 && t.indexOf("h264") < 0) return "WebM";
  return "H.264";
}

/* che cosa sa DECODIFICARE questo browser, cioè quali clip puoi caricare */
function decodifica(){
  let v;
  try { v = document.createElement("video"); } catch(e){ return "sconosciuto"; }
  if(!v.canPlayType) return "sconosciuto";
  const meglio = function(lista){
    let esito = "no";
    for(let i = 0; i < lista.length; i++){
      const r = v.canPlayType(lista[i]);
      if(r === "probably") return "sì";
      if(r && esito === "no") esito = "forse";
    }
    return esito;
  };
  return "H.264 " + meglio(['video/mp4; codecs="avc1.42E01E"', "video/mp4"]) +
         " · HEVC/H.265 " + meglio(['video/mp4; codecs="hvc1"',
                                    'video/mp4; codecs="hev1.1.6.L120.90"',
                                    "video/quicktime"]);
}

function errore(testo){
  $("stato").innerHTML = '<span style="color:#FF6B6B">' + testo + '</span>';
  $("gen").disabled = false; $("genvid").disabled = false;
}

function diagnostica(){
  const f = formatoVideo();
  return "Registra in: " + nomeCodec(f) + (f ? "" : " (registrazione non disponibile qui)") +
         " · Clip accettate: " + decodifica();
}

$("genvid").onclick = function(){
  let rec;
  try {
    if(!window.MediaRecorder) throw new Error("MediaRecorder assente");
    if(!cv.captureStream)     throw new Error("captureStream assente");
    const tipo = formatoVideo();
    if(!tipo){
      const s = ($("codec") && $("codec").value) || "auto";
      throw new Error(s === "auto" || !CODEC[s]
        ? "nessun formato supportato"
        : nomeCodec(CODEC[s][0]) + " non disponibile su questo browser");
    }
    const flusso = cv.captureStream(30);
    if(!flusso || !flusso.getVideoTracks().length) throw new Error("flusso canvas vuoto");
    rec = new MediaRecorder(flusso, {mimeType: tipo, videoBitsPerSecond: 8000000});
    rec.tipoScelto = tipo;
  } catch(err){
    const m = err.message || "";
    if(m.indexOf("non disponibile") >= 0)
      errore(m.charAt(0).toUpperCase() + m.slice(1) + ". Scegli “Automatica” oppure H.264.");
    else
      errore("Qui la registrazione è bloccata (" + m + "). Scarica il file e aprilo " +
             "direttamente in Safari o Chrome, fuori dall'anteprima.");
    return;
  }

  const pezzi = [];
  rec.ondataavailable = function(e){ if(e.data && e.data.size) pezzi.push(e.data); };
  rec.onerror = function(e){
    errore("Errore durante la registrazione: " + ((e.error && e.error.name) || "sconosciuto"));
  };
  rec.onstop = function(){
    if(!pezzi.length){
      errore("Il browser non ha prodotto alcun dato video. Prova ad aprire il file in Safari o Chrome.");
      disegna(); return;
    }
    const est = rec.tipoScelto.indexOf("mp4") >= 0 ? "mp4" : "webm";
    const u = URL.createObjectURL(new Blob(pezzi, {type: rec.tipoScelto}));
    const o = $("out");
    o.innerHTML = '<video src="' + u + '" controls loop muted playsinline ' +
      'style="width:60%;max-width:220px;border-radius:8px"></video>' +
      '<br><a href="' + u + '" download="gol.' + est + '">Scarica il video (' +
      nomeCodec(rec.tipoScelto) + ', .' + est + ')</a>' +
      '<p>Su iPhone il file finisce nell\'app File: aprilo, tocca Condividi e scegli' +
      ' “Salva video” per portarlo nelle Foto, poi caricalo nelle storie.</p>';
    o.classList.remove("nascosto");
    $("gen").disabled = false; $("genvid").disabled = false;
    mostraDiagnostica();
    disegna();
    o.scrollIntoView({behavior: "smooth", block: "nearest"});
  };

  $("gen").disabled = true; $("genvid").disabled = true;
  $("out").classList.add("nascosto");
  try { rec.start(200); }                     // pezzi ogni 200 ms: più affidabile su Safari
  catch(err){ errore("Avvio registrazione fallito: " + err.message); return; }

  const inizio = performance.now();
  (function passo(){
    const trascorso = performance.now() - inizio;
    if(trascorso >= DURATA){
      try { rec.requestData(); } catch(e){}
      try { rec.stop(); } catch(e){ errore("Stop fallito: " + e.message); }
      return;
    }
    disegnaGolAnimato((trascorso % CICLO) / CICLO);
    $("stato").textContent = "Registrazione… " + Math.ceil((DURATA - trascorso) / 1000) + " s";
    requestAnimationFrame(passo);
  })();
};

$("gen").onclick = function(){
  const nome = scheda === "gol" ? "gol.png" : "match-day.png";
  let dati;
  try { dati = cv.toDataURL("image/png"); }
  catch(err){
    errore("Esportazione bloccata (" + (err.name || err.message) + "): questa anteprima non lascia " +
           "salvare le immagini caricate. Apri la versione online e riprova.");
    return;
  }
  const o = $("out");
  o.innerHTML = '<img src="' + dati + '" alt="Grafica pronta">' +
    '<br><a href="' + dati + '" download="' + nome + '">Scarica il PNG</a>' +
    '<p>Se il download non parte, tieni premuta l\'immagine qui sopra e scegli' +
    ' “Aggiungi a Foto”.</p>';
  o.classList.remove("nascosto");
  mostraDiagnostica();
  o.scrollIntoView({behavior: "smooth", block: "nearest"});
};

function mostraDiagnostica(){
  $("stato").innerHTML = '<span style="color:#8F8F88;font-size:12px">' + diagnostica() + '</span>';
}
$("codec").onchange = mostraDiagnostica;

$("c-handle").value = CFG.handle;
$("c-tag").value = CFG.hashtag;
mostraDiagnostica();

if(document.fonts && document.fonts.load){
  document.fonts.load("100px Anton").then(disegna).catch(disegna);
  document.fonts.ready.then(disegna);
}
